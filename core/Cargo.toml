[workspace]
resolver = "2"
members = ["crates/hexwitch-core", "crates/hexwitch-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/parth/hexwitch.nvim"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
