name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  rust:
    name: Core engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.10.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test engine and thin Neovim adapter
        run: cargo test --all --locked

  legacy-lua:
    name: Legacy Neovim plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/nvim-legacy
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.10.0

      - name: Install dependencies
        run: |
          git clone --depth=1 https://github.com/nvim-lua/plenary.nvim.git ~/.local/share/nvim/lazy/plenary.nvim
          git clone --depth=1 https://github.com/nvim-telescope/telescope.nvim.git ~/.local/share/nvim/lazy/telescope.nvim

      - name: Run unit tests
        run: |
          nvim --headless --noplugin -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/hexwitch/ { minimal_init = 'tests/minimal_init.lua' }"

      - name: Test plugin loading
        run: |
          nvim --headless -c "
            set rtp+=.
            try
              lua require('hexwitch')
              print('Plugin loaded successfully')
            catch
              print('Plugin failed to load: ' .. vim.inspect(err))
              os.exit(1)
            end
          " -c "qa"

  notify-results:
    needs: [rust, legacy-lua]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        if: ${{ needs.rust.result != 'success' || needs.legacy-lua.result != 'success' }}
        run: |
          echo "Some jobs failed. Check the job logs."
          exit 1
