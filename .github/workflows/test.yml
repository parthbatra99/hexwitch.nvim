name: Engine and playground

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Fixture metadata and authored evaluation rebuilds
        run: |
          python3 eval/verify-fixtures.py
          python3 -m unittest discover -s eval -p 'test_*.py'
      - name: Engine and local playground tests (offline)
        run: cargo test --all --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser controls (offline, isolated profile)
        run: |
          cargo build --locked
          npm install --prefix "$RUNNER_TEMP/hexwitch-browser" playwright@1.64.0
          "$RUNNER_TEMP/hexwitch-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/hexwitch-browser/node_modules" node ../playground/smoke.cjs
